name: Profile Stats

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The public github-readme-stats.vercel.app instance is shut down, so the cards are
      # rendered here instead. Each step keeps the previous SVG if generation fails.
      - name: GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&count_private=true&include_all_commits=true&hide=stars&hide_rank=true
          path: profile-stats/stats.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Top Languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&langs_count=8
          path: profile-stats/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Streak card
        continue-on-error: true
        run: |
          mkdir -p profile-stats
          curl -fsSL --retry 3 --max-time 60 \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=github-dark&hide_border=true&locale=en" \
            -o streak.tmp
          grep -q "<svg" streak.tmp && mv streak.tmp profile-stats/streak.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-stats
          if git commit -m "Update profile stats"; then
            git pull --rebase
            git push
          fi
